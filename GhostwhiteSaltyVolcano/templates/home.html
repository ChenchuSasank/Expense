{% extends "base.html" %}

{% block content %}
<style>
.home-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    padding: 40px 20px;
}

.welcome-text {
    text-align: center;
    margin-bottom: 40px;
}

.welcome-text h2 {
    color: #4a90e2;
    font-size: 28px;
    margin-bottom: 10px;
}

.welcome-text p {
    color: #666;
    font-size: 16px;
}

.category-buttons {
    display: flex;
    gap: 20px;
    width: 100%;
    max-width: 500px;
}

.category-btn {
    flex: 1;
    background: linear-gradient(135deg, #4a90e2, #357abd);
    color: white;
    text-decoration: none;
    padding: 30px 20px;
    border-radius: 15px;
    text-align: center;
    font-weight: bold;
    font-size: 18px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    transition: all 0.3s ease;
    border: none;
    cursor: pointer;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.expense-btn {
    background: linear-gradient(135deg, #FF8C00, #FF7F00);
}

.income-btn {
    background: linear-gradient(135deg, #27ae60, #229954);
}

.category-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}

.category-btn .icon {
    font-size: 32px;
    margin-bottom: 10px;
}

@media (max-width: 768px) {
    .category-buttons {
        flex-direction: row;
        gap: 15px;
    }

    .category-btn {
        padding: 25px 15px;
        font-size: 16px;
        min-height: 100px;
    }

    .category-btn .icon {
        font-size: 28px;
    }
}
</style>

<div class="home-container">
    <div class="welcome-text">
        <h2>💰 Welcome back, {{ username }}!</h2>
        <p>Choose a category to manage your finances</p>
    </div>

    <div class="category-buttons">
        <a href="{{ url_for('expense_dashboard') }}" class="category-btn expense-btn">
            <div class="icon">💸</div>
            <div>Expense</div>
        </a>
        <a href="{{ url_for('income_dashboard') }}" class="category-btn income-btn">
            <div class="icon">💰</div>
            <div>Income</div>
        </a>
    </div>
</div>
{% endblock %}
