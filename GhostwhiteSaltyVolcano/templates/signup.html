
{% extends "base.html" %}

{% block content %}
<style>
.auth-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 200px);
    padding: 20px;
}

.auth-card {
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    max-width: 500px;
    width: 100%;
}

.auth-title {
    text-align: center;
    color: #4a90e2;
    margin-bottom: 30px;
    font-size: 28px;
}

.auth-form-group {
    margin-bottom: 20px;
}

.auth-form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    color: #555;
}

.auth-form-group input {
    width: 100%;
    padding: 0;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    transition: border-color 0.3s ease;
    height: 44px;
    box-sizing: border-box;
    padding-left: 12px;
    padding-right: 12px;
}

.auth-form-group input:focus {
    outline: none;
    border-color: #4a90e2;
}

.auth-btn {
    width: 100%;
    background: #4a90e2;
    color: white;
    border: none;
    padding: 0;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.3s ease;
    margin-top: 10px;
    height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
}

.auth-btn:hover {
    background: #357abd;
}

.auth-link {
    text-align: center;
    margin-top: 20px;
    color: #666;
}

.auth-link a {
    color: #4a90e2;
    text-decoration: none;
    font-weight: bold;
}

.auth-link a:hover {
    text-decoration: underline;
}

.error-message {
    background: #fee;
    color: #c33;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 20px;
    border: 1px solid #fcc;
}

.success-message {
    background: #efe;
    color: #3c3;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 20px;
    border: 1px solid #cfc;
}
</style>

<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">🔐 Sign Up</h1>
        
        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}
        
        {% if success %}
        <div class="success-message">{{ success }}</div>
        {% endif %}

        <form action="{{ url_for('signup_process') }}" method="POST" id="signup-form">
            <div class="auth-form-group">
                <label for="username">👤 Username:</label>
                <input type="text" id="username" name="username" required minlength="3" maxlength="20" placeholder="admin">
            </div>

            <div class="auth-form-group">
                <label for="phone">📱 Phone Number (10 digits):</label>
                <input type="tel" id="phone" name="phone" required pattern="[0-9]{10}" placeholder="9876543210" maxlength="10">
            </div>

            <div class="auth-form-group">
                <label for="email">📧 Gmail (can contain letters, numbers, must end with @gmail.com):</label>
                <input type="email" id="email" name="email" required placeholder="YourName123@gmail.com">
            </div>

            <div class="auth-form-group">
                <label for="password">🔒 New Password (min 8 chars with uppercase, lowercase, number, special char):</label>
                <input type="password" id="password" name="password" required minlength="8">
            </div>

            <div class="auth-form-group">
                <label for="confirm_password">🔒 Retype Password:</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
            </div>

            <div class="auth-form-group" id="otp-section" style="display: none;">
                <label for="otp">📱 Enter OTP (sent to your phone):</label>
                <input type="text" id="otp" name="otp" pattern="[0-9]{6}" maxlength="6" placeholder="123456">
                <button type="button" id="resend-otp" class="auth-btn" style="margin-top: 10px; background: #6c757d;">🔄 Resend OTP</button>
            </div>

            <input type="hidden" id="step" name="step" value="1">
            
            <button type="submit" class="auth-btn" id="submit-btn">📝 Sign Up</button>
        </form>

        <div class="auth-link">
            Already have an account? <a href="{{ url_for('signin') }}">Sign In</a>
        </div>
        
        <div class="auth-link">
            <a href="{{ url_for('auth_choice') }}">← Back to Authentication</a>
        </div>
    </div>
</div>

<script>
// Enhanced validation
document.getElementById('signup-form').addEventListener('submit', function(e) {
    const step = document.getElementById('step').value;
    
    if (step === '1') {
        e.preventDefault();
        if (validateStep1()) {
            sendOTP();
        }
    } else if (step === '2') {
        e.preventDefault();
        if (validateOTP()) {
            this.submit();
        }
    }
});

function validateStep1() {
    const username = document.getElementById('username').value;
    const phone = document.getElementById('phone').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    // Username validation
    if (username.length < 3) {
        alert('Username must be at least 3 characters long');
        return false;
    }
    
    // Phone validation
    if (!/^[0-9]{10}$/.test(phone)) {
        alert('Phone number must be exactly 10 digits');
        return false;
    }
    
    // Email validation
    if (!email.toLowerCase().endsWith('@gmail.com')) {
        alert('Email must end with @gmail.com');
        return false;
    }
    
    // Password validation
    const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
    if (!passwordRegex.test(password)) {
        alert('Password must contain at least 8 characters with uppercase, lowercase, number, and special character');
        return false;
    }
    
    if (password !== confirmPassword) {
        alert('Passwords do not match');
        return false;
    }
    
    return true;
}

function sendOTP() {
    const phone = document.getElementById('phone').value;
    const email = document.getElementById('email').value;
    
    // Show OTP section
    document.getElementById('otp-section').style.display = 'block';
    document.getElementById('step').value = '2';
    document.getElementById('submit-btn').textContent = '✅ Verify OTP & Sign Up';
    
    // Generate and display OTP (in real app, this would be sent via SMS)
    const otp = Math.floor(100000 + Math.random() * 900000);
    alert(`Your OTP is: ${otp}\n\n(In a real app, this would be sent to ${phone})`);
    
    // Store OTP in session storage for validation
    sessionStorage.setItem('signup_otp', otp);
    sessionStorage.setItem('otp_timestamp', Date.now());
}

function validateOTP() {
    const enteredOTP = document.getElementById('otp').value;
    const storedOTP = sessionStorage.getItem('signup_otp');
    const otpTimestamp = sessionStorage.getItem('otp_timestamp');
    
    if (!enteredOTP) {
        alert('Please enter the OTP');
        return false;
    }
    
    if (!storedOTP) {
        alert('OTP expired. Please request a new one.');
        return false;
    }
    
    // Check if OTP is expired (5 minutes)
    if (Date.now() - otpTimestamp > 300000) {
        alert('OTP has expired. Please request a new one.');
        sessionStorage.removeItem('signup_otp');
        sessionStorage.removeItem('otp_timestamp');
        return false;
    }
    
    if (enteredOTP !== storedOTP) {
        alert('Invalid OTP. Please try again.');
        return false;
    }
    
    // Clear OTP from storage
    sessionStorage.removeItem('signup_otp');
    sessionStorage.removeItem('otp_timestamp');
    return true;
}

// Resend OTP functionality
document.getElementById('resend-otp').addEventListener('click', function() {
    sendOTP();
});

// Real-time password validation
document.getElementById('confirm_password').addEventListener('input', function() {
    const password = document.getElementById('password').value;
    const confirmPassword = this.value;
    
    if (password !== confirmPassword) {
        this.setCustomValidity('Passwords do not match');
    } else {
        this.setCustomValidity('');
    }
});

// Real-time email validation
document.getElementById('email').addEventListener('input', function() {
    if (!this.value.toLowerCase().endsWith('@gmail.com') && this.value.length > 0) {
        this.setCustomValidity('Email must end with @gmail.com');
    } else {
        this.setCustomValidity('');
    }
});
</script>
{% endblock %}
