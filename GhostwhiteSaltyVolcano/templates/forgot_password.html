
{% extends "base.html" %}

{% block content %}
<style>
.auth-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 200px);
    padding: 20px;
}

.auth-card {
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    max-width: 500px;
    width: 100%;
}

.auth-title {
    text-align: center;
    color: #4a90e2;
    margin-bottom: 30px;
    font-size: 28px;
}

.auth-form-group {
    margin-bottom: 20px;
}

.auth-form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    color: #555;
}

.auth-form-group input {
    width: 100%;
    padding: 15px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    transition: border-color 0.3s ease;
}

.auth-form-group input:focus {
    outline: none;
    border-color: #4a90e2;
}

.auth-btn {
    width: 100%;
    background: #4a90e2;
    color: white;
    border: none;
    padding: 15px;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s ease;
    margin-top: 10px;
}

.auth-btn:hover {
    background: #357abd;
}

.auth-link {
    text-align: center;
    margin-top: 20px;
    color: #666;
}

.auth-link a {
    color: #4a90e2;
    text-decoration: none;
    font-weight: bold;
}

.auth-link a:hover {
    text-decoration: underline;
}

.error-message {
    background: #fee;
    color: #c33;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 20px;
    border: 1px solid #fcc;
}

.success-message {
    background: #efe;
    color: #3c3;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 20px;
    border: 1px solid #cfc;
}
</style>

<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">🔑 Forgot Password</h1>
        
        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}
        
        {% if success %}
        <div class="success-message">{{ success }}</div>
        {% endif %}

        <form action="{{ url_for('forgot_password_process') }}" method="POST">
            {% if step == '2' %}
            <div class="auth-form-group">
                <label for="phone">📱 Phone Number:</label>
                <input type="tel" id="phone" name="phone" value="{{ phone }}" readonly style="background: #f5f5f5;">
            </div>
            
            <div class="auth-form-group">
                <label for="otp">📱 Enter OTP:</label>
                <input type="text" id="otp" name="otp" required pattern="[0-9]{6}" maxlength="6" placeholder="123456">
            </div>
            
            <div class="auth-form-group">
                <label for="new_password">🔒 New Password:</label>
                <input type="password" id="new_password" name="new_password" required minlength="8" placeholder="New password">
            </div>
            
            <div class="auth-form-group">
                <label for="confirm_password">🔒 Confirm New Password:</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="8" placeholder="Confirm password">
            </div>
            
            <div class="auth-form-group">
                <label for="new_email">📧 New Gmail (optional):</label>
                <input type="email" id="new_email" name="new_email" pattern=".*@gmail\.com$" placeholder="newemail@gmail.com">
            </div>
            
            <input type="hidden" name="step" value="2">
            <button type="submit" class="auth-btn">✅ Reset Password</button>
            {% else %}
            <div class="auth-form-group">
                <label for="phone">📱 Phone Number:</label>
                <input type="tel" id="phone" name="phone" required pattern="[0-9]{10}" maxlength="10" placeholder="9876543210">
            </div>
            
            <input type="hidden" name="step" value="1">
            <button type="submit" class="auth-btn">📱 Send OTP</button>
            {% endif %}
        </form>

        <div class="auth-link">
            <a href="{{ url_for('signin') }}">← Back to Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
