{% extends "base.html" %}

{% block content %}
<style>
.reports-container {
    padding: 20px;
    max-width: 800px;
    margin: 0 auto;
}

.reports-header {
    text-align: center;
    margin-bottom: 40px;
}

.reports-header h2 {
    color: #4a90e2;
    font-size: 28px;
    margin-bottom: 10px;
}

.category-selection {
    display: flex;
    gap: 15px;
    margin-bottom: 30px;
    justify-content: center;
}

.category-select-btn {
    flex: 1;
    max-width: 200px;
    min-height: 100px;
    background: linear-gradient(135deg, #4a90e2, #357abd);
    color: white;
    text-decoration: none;
    border-radius: 12px;
    font-weight: bold;
    font-size: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px;
}

.expense-select {
    background: linear-gradient(135deg, #FF8C00, #FF7F00);
}

.income-select {
    background: linear-gradient(135deg, #27ae60, #229954);
}

.category-select-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
}

.category-select-btn .icon {
    font-size: 26px;
    margin-bottom: 8px;
}

.chart-section {
    display: none;
    margin-top: 30px;
}

.filter-form {
    background: #f8f9fa;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.filter-row {
    display: flex;
    gap: 15px;
    margin-bottom: 15px;
    align-items: end;
}

.form-group {
    flex: 1;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
    color: #333;
}

.form-group select,
.form-group input {
    width: 100%;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    height: 44px;
    padding: 0 12px;
    box-sizing: border-box;
    transition: border-color 0.3s ease;
}

.form-group select:focus,
.form-group input:focus {
    outline: none;
    border-color: #4a90e2;
}

.btn {
    background: #4a90e2;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.3s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-width: 140px;
    height: 44px;
    font-size: 16px;
    box-sizing: border-box;
    padding: 0 12px;
}

.btn:hover {
    background: #357abd;
}

.back-btn {
    background: #6c757d;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 500;
    margin-top: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 250px;
    height: 44px;
    box-sizing: border-box;
    font-size: 16px;
    padding: 0 12px;
}

@media (max-width: 768px) {
    .category-selection {
        flex-direction: column;
        gap: 10px;
    }

    .filter-row {
        flex-direction: column;
        gap: 10px;
    }
}
</style>

<div class="reports-container">
    <div class="reports-header">
        <h2>📈 Reports Dashboard</h2>
        <p>Select a category to view reports</p>
    </div>

    <div class="category-selection">
        <button onclick="showReports('Expense')" class="category-select-btn expense-select">
            <div class="icon">💸</div>
            <div>Expense Reports</div>
        </button>
        <button onclick="showReports('Income')" class="category-select-btn income-select">
            <div class="icon">💰</div>
            <div>Income Reports</div>
        </button>
    </div>

    <div id="chart-section" class="chart-section">
        <div class="filter-form">
            <div class="filter-row">
                <div class="form-group">
                    <label>Category Type:</label>
                    <select id="category_type" onchange="updateReportSubcategories()">
                        <option value="Expense">Expense</option>
                        <option value="Income">Income</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Select Date:</label>
                    <input type="date" id="selected_date" value="">
                </div>
            </div>
            <div class="filter-row">
                <div class="form-group">
                    <label>View By:</label>
                    <select id="view_by">
                        <option value="Day">Day</option>
                        <option value="Week">Week</option>
                        <option value="Month">Month</option>
                        <option value="Year">Year</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Group By:</label>
                    <select id="group_by">
                        <option value="Sub-Category">Category</option>
                        <option value="Category">Main Category</option>
                    </select>
                </div>
            </div>
            <div class="filter-row">
                <div class="form-group">
                    <label>Filter Category:</label>
                    <select id="filter_subcategory">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>&nbsp;</label>
                    <button type="button" class="btn" onclick="generateChart()">📊 Generate Chart</button>
                </div>
            </div>
        </div>

        <div id="chart-container">
            <canvas id="reportChart" width="400" height="400"></canvas>
        </div>
    </div>

    <div style="text-align: center; display: flex; justify-content: center; margin-top: 30px;">
        <a href="{{ url_for('home') }}" class="back-btn">🏠 Back to Home</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
let currentChart = null;
let reportSubcategoriesData = {};

fetch('/get_subcategories')
    .then(response => response.json())
    .then(data => {
        reportSubcategoriesData = data;
    });

function showReports(categoryType) {
    document.getElementById('chart-section').style.display = 'block';
    document.getElementById('category_type').value = categoryType;
    updateReportSubcategories();
    generateChart();
}

function updateReportSubcategories() {
    const categoryType = document.getElementById('category_type').value;
    const subcategorySelect = document.getElementById('filter_subcategory');
    subcategorySelect.innerHTML = '<option value="">All Categories</option>';

    let categories = [];
    if (categoryType === 'Income' && reportSubcategoriesData.Income) {
        categories = reportSubcategoriesData.Income.map(item => item.name);
    } else if (categoryType === 'Expense' && reportSubcategoriesData.Expense) {
        categories = reportSubcategoriesData.Expense.map(item => item.name);
    }

    categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        subcategorySelect.appendChild(option);
    });
}

function generateChart() {
    const categoryType = document.getElementById('category_type').value;
    const selectedDate = document.getElementById('selected_date').value;
    const viewBy = document.getElementById('view_by').value;
    const groupBy = document.getElementById('group_by').value;
    const filterSubcategory = document.getElementById('filter_subcategory').value;

    const params = new URLSearchParams({
        category_type: categoryType,
        selected_date: selectedDate,
        view_by: viewBy,
        group_by: groupBy,
        filter_subcategory: filterSubcategory
    });

    fetch(`/chart_data?${params}`)
        .then(response => response.json())
        .then(data => {
            const ctx = document.getElementById('reportChart').getContext('2d');

            if (currentChart) {
                currentChart.destroy();
            }

            if (data.labels.length === 0) {
                ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('No data available for selected filters', ctx.canvas.width / 2, ctx.canvas.height / 2);
                return;
            }

            currentChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: data.labels,
                    datasets: [{
                        data: data.values,
                        backgroundColor: data.colors,
                        borderWidth: 2,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 20,
                                font: {
                                    size: 12
                                }
                            }
                        },
                        title: {
                            display: true,
                            text: `${categoryType} Distribution - ${viewBy} View`
                        }
                    }
                }
            });
        })
        .catch(error => {
            console.error('Error generating chart:', error);
            alert('Error generating chart. Please try again.');
        });
}

document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('selected_date').value = new Date().toISOString().split('T')[0];
});
</script>
{% endblock %}
